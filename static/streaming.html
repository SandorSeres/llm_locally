<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <title>Kérdés - felelet streaming módban</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }

        #chatbot {
            width: 100%;
            max-width: 600px;
            background-color: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
            font-size: 24px;
        }

        #analyzeForm, #uploadForm {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }

        input[type="text"], input[type="file"] {
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        input[type="submit"] {
            background-color: #007bff;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: #0056b3;
        }

        #result {
            margin-top: 20px;
            background-color: #f8f8f8;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #ddd;
            overflow-y: auto;
            max-height: 300px;
        }

        #footer {
            text-align: center;
            padding: 10px;
            margin-top: auto;
        }

        #footer-logo {
            height: 30px;
        }

        #footer-text {
            font-family: 'Times New Roman', serif;
            font-size: 24px;
            font-weight: bold;
            font-style: italic;
            color: red;
        }
    </style>
    <script>
        const protocol = window.location.protocol; 
        const hostname = window.location.hostname; 
        const port = window.location.port; 

        document.addEventListener('DOMContentLoaded', function () {
            const analyzeForm = document.getElementById('analyzeForm');
            const uploadForm = document.getElementById('uploadForm');

            analyzeForm.onsubmit = function (event) {
                event.preventDefault();
                const query = document.getElementById('query').value;
                const resultDiv = document.getElementById('result');
                const searchTimeDiv = document.getElementById('searchTime');
                resultDiv.innerHTML = '';
                searchTimeDiv.innerHTML = '';
                const apiUrl = `${protocol}//${hostname}${port ? `:${port}` : ''}/generate`;
                const startTime = Date.now();

                fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ query })
                })
                    .then(response => response.body.getReader())
                    .then(reader => {
                        const decoder = new TextDecoder('utf-8');
                        return reader.read().then(function processText({ done, value }) {
                            if (done) {
                                const endTime = Date.now();
                                searchTimeDiv.textContent = `Válasz idő: ${(endTime - startTime) / 1000} másodperc`;
                                return;
                            }
                            const text = decoder.decode(value, { stream: true });
                            try {
                                text.split('\n').forEach(line => {
                                    if (line.startsWith('data: ')) {
                                        const json = JSON.parse(line.substr(6));
                                        const content = json.choices[0].delta.content || '';
                                        resultDiv.textContent += content;
                                    }
                                });
                            } catch (error) {
                                console.error("JSON feldolgozási hiba:", error);
                            }
                            return reader.read().then(processText);
                        });
                    })
                    .catch(error => {
                        console.error('Hiba történt:', error);
                    });
            };

            uploadForm.onsubmit = function (event) {
                event.preventDefault();
                const fileInput = document.getElementById('file');
                const file = fileInput.files[0];
                if (!file) {
                    alert('Válassz ki egy fájlt!');
                    return;
                }
                const formData = new FormData();
                formData.append('file', file);

                const apiUrl = `${protocol}//${hostname}${port ? `:${port}` : ''}/upload/`;

                fetch(apiUrl, {
                    method: 'POST',
                    body: formData
                })
                    .then(response => response.json())
                    .then(data => {
                        alert(data.message || 'Fájl sikeresen feltöltve!');
                    })
                    .catch(error => {
                        console.error('Feltöltési hiba:', error);
                        alert('Hiba történt a fájl feltöltése során.');
                    });
            };
        });
    </script>
</head>

<body>
    <div id="chatbot">
        <h1>Kérdés - felelet streaming módban</h1>
        <form id="analyzeForm">
            <input type="text" id="query" name="query" placeholder="Írjon ide egy kérdést...">
            <input type="submit" value="Elemzés">
        </form>
        <form id="uploadForm">
            <input type="file" id="file" name="file">
            <input type="submit" value="Fájl feltöltése">
        </form>
        <div id="result"></div>
        <div id="searchTime"></div>
    </div>
    <div id="footer">
        <img src="/static/hospitaly.png" alt="Logo" id="footer-logo">
        <span id="footer-text">CoDe</span>
    </div>
</body>

</html>

services:
  ollama:
    image: sseres/ollama:latest
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_FLASH_ATTENTION=1  
      - OLLAMA_KV_CACHE_TYPE=q8_0
      - GIN_MODE=release
      - OLLAMA_RATE_LIMIT_GENERATE=100
      - OLLAMA_RATE_LIMIT_EMBEDDINGS=50
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  neo4j:
    image: neo4j:latest
    container_name: neo4j_vector
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
      - "7473:7473"  # HTTPS
    environment:
      NEO4J_AUTH: "${NEO4J_USERNAME}/${NEO4J_PASSWORD}"

    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/import
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7474"]
      interval: 20s
      timeout: 10s
      retries: 10

  app:
    image: sseres/chatbot_app:latest
    container_name: chatbot_app
    ports:
      - "8000:8000"  # FastAPI app HTTP
    depends_on:
      - neo4j
      - ollama
    volumes:
      - app_data:/app/data
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - EXIT_AFTER_DATE=2025-12-31
      - NVIDIA_VISIBLE_DEVICES=all  # GPU láthatóság
      - NVIDIA_DRIVER_CAPABILITIES=all  # GPU funkciók engedélyezése
      - NEO4J_URI=bolt://neo4j_vector:7687
      - NEO4J_USERNAME=${NEO4J_USERNAME}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}


volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  app_data:

